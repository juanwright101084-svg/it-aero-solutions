[functions]

  [functions.emails]
  included_files = [
    "./emails/**"
  ]

[build]
publish = "."
functions = "netlify/functions"

[[redirects]]
from = "/"
to = "/es/index.html"
status = 301

[[redirects]]
from = "/es"
to = "/es/index.html"
status = 200

[[redirects]]
from = "/es/service"
to = "/es/service.html"
status = 200

[[redirects]]
from = "/es/about"
to = "/es/about.html"
status = 200

[[redirects]]
from = "/es/why"
to = "/es/why.html"
status = 200

[[redirects]]
from = "/es/contact"
to = "/es/contact.html"
status = 200

[[redirects]]
from = "/en"
to = "/en/index.html"
status = 200

[[redirects]]
from = "/en/service"
to = "/en/service.html"
status = 200

[[redirects]]
from = "/en/about"
to = "/en/about.html"
status = 200

[[redirects]]
from = "/en/why"
to = "/en/why.html"
status = 200

[[redirects]]
from = "/en/contact"
to = "/en/contact.html"
status = 200

[context]

  [context.production]

    [context.production.functions]

      [context.production.functions.emails]
      included_files = [
        "./emails/**"
      ]

  [context.master]

    [context.master.functions]

      [context.master.functions.emails]
      included_files = [
        "./emails/**"
      ]